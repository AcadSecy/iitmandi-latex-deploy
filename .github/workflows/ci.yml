name: CI

# Actions minutes for this private repository are limited, so CI runs only
# when asked: "Run workflow" on the Actions tab, or `gh workflow run CI --ref
# main`. Run it after a batch of pushes, before relying on main.
on:
  workflow_dispatch:
    inputs:
      all:
        description: Run every job, not only those whose code changed since the last passing run
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which jobs to run: only those whose code changed since the last
  # passing run, so a cancelled or failed run is covered by the next one. The
  # "all" input, the first run and changes to the workflows themselves run
  # everything. `base` is the commit of the last passing run, if any.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      branding: ${{ steps.areas.outputs.branding }}
      templates: ${{ steps.areas.outputs.templates }}
      web: ${{ steps.areas.outputs.web }}
      clsi: ${{ steps.areas.outputs.clsi }}
      git_bridge: ${{ steps.areas.outputs.git_bridge }}
      base: ${{ steps.areas.outputs.base }}
    steps:
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          ALL: ${{ inputs.all }}
        run: |
          AREAS="branding templates web clsi git_bridge"
          run_all() {
            echo "Running every job: $1"
            for area in $AREAS; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }
          base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty') || base=
          [ "$ALL" != true ] || run_all "asked for every job"
          [ -n "$base" ] || run_all "no earlier passing run"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" = "$HEAD_SHA" ]; then
            echo "Nothing changed since the last passing run"
            for area in $AREAS; do echo "$area=false" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/compare/$base...$HEAD_SHA" \
            --jq '.files[].filename' > changed.txt || run_all "cannot compare with $base"
          [ "$(wc -l < changed.txt)" -lt 300 ] || run_all "too many changed files"
          echo "Changed since the last passing run ($base):"
          cat changed.txt
          ! grep -q '^\.github/' changed.txt || run_all "workflow files changed"
          area() {
            if grep -qE "$2" changed.txt; then value=true; else value=false; fi
            echo "$1=$value" | tee -a "$GITHUB_OUTPUT"
          }
          deps='libraries/|package\.json$|yarn\.lock$|\.yarnrc\.yml$|\.yarn/|tsconfig'
          area branding '^(services/web/|tools/branding/)'
          area templates '^(services/web/modules/(iitmandi-templates|page-setup)/|deploy/iitmandi/texlive/)'
          area web "^(services/web/|$deps)"
          area clsi "^(services/clsi/|server-ce/|deploy/iitmandi/texlive/|$deps)"
          area git_bridge '^services/git-bridge/'

  branding:
    name: Branding and stylesheets
    needs: changes
    if: needs.changes.outputs.branding == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # dependencies are cached below; the automatic cache needs Corepack first
          package-manager-cache: false
      - name: Locale strings use __appName__
        run: node tools/branding/rebrand-locales.mjs --check
      - name: Help links stay on the platform
        run: node tools/branding/rewrite-help-links.mjs --check
      - name: Compile the main stylesheet
        run: |
          mkdir -p "$RUNNER_TEMP/sass"
          npm install --prefix "$RUNNER_TEMP/sass" --no-audit --no-fund sass@1 bootstrap@5.3.7
          "$RUNNER_TEMP/sass/node_modules/.bin/sass" --no-source-map --quiet \
            --load-path="$RUNNER_TEMP/sass/node_modules" \
            services/web/frontend/stylesheets/main-style.scss "$RUNNER_TEMP/main-style.css"

  templates:
    name: Templates
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # The TeX Live image the platform compiles in: the first one pinned in
      # deploy/iitmandi/texlive/images.txt, under the same name as on the server
      - name: Fetch the pinned TeX Live image
        run: |
          name=$(grep -Ev '^[[:space:]]*(#|$)' deploy/iitmandi/texlive/images.txt | awk 'NR == 1 {print $1}')
          IMAGES_DIR="$RUNNER_TEMP/images" bash deploy/iitmandi/texlive/texlive-images.sh fetch "$name"
          echo "TEXLIVE_IMAGE=$name" >> "$GITHUB_ENV"
      - name: Assemble the IIT Mandi templates
        run: >
          node services/web/modules/iitmandi-templates/scripts/assemble.mjs
          "$RUNNER_TEMP/templates" > "$RUNNER_TEMP/templates.txt"
      # What Format > Page setup writes (font size, paper, margins, spacing,
      # font) must compile in every template it can change
      - name: Add page setup variants of the templates
        run: |
          node services/web/modules/page-setup/scripts/page-setup-variants.mjs \
            "$RUNNER_TEMP/templates" < "$RUNNER_TEMP/templates.txt" > "$RUNNER_TEMP/variants.txt"
          cat "$RUNNER_TEMP/variants.txt" >> "$RUNNER_TEMP/templates.txt"
      - name: Compile every template with the platform's TeX Live image
        run: |
          docker run --rm -v "$RUNNER_TEMP:/work" "$TEXLIVE_IMAGE" bash -c '
            status=0
            while read -r id compiler main; do
              case "$compiler" in
                xelatex) flag=-xelatex ;;
                lualatex) flag=-lualatex ;;
                *) flag=-pdf ;;
              esac
              cd "/work/templates/$id"
              if latexmk $flag -interaction=nonstopmode -halt-on-error -file-line-error "$main" > build.log 2>&1 &&
                ! grep -qE "There were undefined references|(Citation|Reference) .* undefined" "${main%.tex}.log"; then
                echo "ok   $id $main"
              else
                echo "FAIL $id $main"
                tail -n 40 build.log
                status=1
              fi
            done < /work/templates.txt
            exit $status'

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the type check diffs against the base commit
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # dependencies are cached below; the automatic cache needs Corepack first
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-

      - name: Install dependencies
        run: yarn workspaces focus @overleaf/web

      # The LaTeX and BibTeX parsers are built from their grammars (not committed)
      - name: Generate editor parsers
        run: yarn workspace @overleaf/web run lezer-latex:generate

      # Upstream's public repository leaves out some private modules, and the
      # extended Community Edition (CEP) is not type-clean, so the full type
      # check always reports errors. Fail only on type errors in files changed
      # since the last passing run (or since the upstream base when there is
      # none, or every job was asked for), counting CEP's own files as upstream.
      - name: Type-check changed files
        working-directory: services/web
        env:
          # yu-i-i/overleaf-cep v6.3.0-ext-v5.1; update when merging a newer release
          CEP_BASE: 738bebb743e6ea8f579a1860e1de1fbfc292f505
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          base="${BASE:-upstream-base}"
          if git merge-base --is-ancestor "$base" "$CEP_BASE" 2>/dev/null &&
            git merge-base --is-ancestor "$CEP_BASE" HEAD 2>/dev/null; then
            base="$CEP_BASE"
          fi
          yarn tsc --noEmit --pretty false > "$RUNNER_TEMP/tsc.log" || true
          echo "$(grep -c 'error TS' "$RUNNER_TEMP/tsc.log" || true) type errors in total"
          git diff --name-only "$base"...HEAD -- . | sed -e 's#^services/web/##' -e '/^$/d' > "$RUNNER_TEMP/changed.txt"
          grep 'error TS' "$RUNNER_TEMP/tsc.log" \
            | grep -vE "error TS2307: Cannot find module '([^']*/(modules|stories)/|@wf/|@modules/|[^']*webpack\.config\.dev')" \
            | grep -F -f "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/errors.txt" || true
          if [ -s "$RUNNER_TEMP/errors.txt" ]; then
            cat "$RUNNER_TEMP/errors.txt"
            exit 1
          fi
          echo "No type errors in changed files"

      # The upstream repository does not publish its ESLint, Stylelint or
      # Prettier configuration, so linting is not part of CI yet.

      - name: Unit tests (rebranded backend code and compile queue)
        working-directory: services/web
        run: >
          yarn vitest run --project=Parallel
          test/unit/src/Compile/CompileQueue.test.mjs
          test/unit/src/Compile/CompileManager.test.mjs
          modules/iitmandi-templates/test/unit/src
          test/unit/src/Email
          test/unit/src/Downloads/ProjectDownloadsController.test.mjs
          test/unit/src/User/UserDeleter.test.mjs
          test/unit/src/User/UserEmailsController.test.mjs
          test/unit/src/TokenAccess/TokenAccessController.test.mjs

      # Only the handlers the compile queue changes. Six upstream tests for the
      # SyncTeX request validation (proxySyncCode/proxySyncPdf) fail in this
      # environment; they cover code this branch does not change.
      - name: Unit tests (compile controller)
        working-directory: services/web
        run: >
          yarn vitest run --project=Parallel
          test/unit/src/Compile/CompileController.test.mjs
          --testNamePattern '^CompileController (compile|stopCompile) '

      - name: Unit tests (editor waiting room against Redis, storage, source code, retention, logo, chapter compile)
        working-directory: services/web
        env:
          TEST_REDIS_HOST: localhost
        run: >
          yarn vitest run --project=Parallel
          modules/editor-waiting-room
          modules/storage-quota
          modules/source-code
          modules/retention
          modules/iitmandi-logo
          modules/chapter-compile

      - name: Frontend tests (project list, welcome message, Ask AI, page setup, logo)
        working-directory: services/web
        env:
          NODE_ENV: test
          TZ: GMT
        run: >
          yarn mocha --timeout 5000 --exit
          --extension js,jsx,mjs,ts,tsx
          --require test/frontend/bootstrap.js
          test/frontend/features/project-list/components/project-list-root.test.tsx
          test/frontend/features/project-list/components/welcome-message.test.tsx
          modules/ask-ai/test/frontend/open-assistant.test.ts
          modules/page-setup/test/frontend/preamble.test.ts
          modules/iitmandi-logo/test/frontend/logo-insertion.test.ts

  clsi:
    name: Compile service
    needs: changes
    if: needs.changes.outputs.clsi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # dependencies are cached below; the automatic cache needs Corepack first
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-

      - name: Install dependencies
        run: yarn workspaces focus @overleaf/clsi

      - name: Unit tests (running, stopping and pausing compiles)
        working-directory: services/clsi
        run: >
          yarn vitest run --config ./vitest.config.unit.cjs
          test/unit/js/DockerRunner.test.js
          test/unit/js/LatexRunner.test.js
          test/unit/js/CompileManager.test.js

      # The TeX Live image the platform compiles in: the first one pinned in
      # deploy/iitmandi/texlive/images.txt, under the same name as on the server
      - name: Fetch the pinned TeX Live image
        run: |
          name=$(grep -Ev '^[[:space:]]*(#|$)' deploy/iitmandi/texlive/images.txt | awk 'NR == 1 {print $1}')
          IMAGES_DIR="$RUNNER_TEMP/images" bash deploy/iitmandi/texlive/texlive-images.sh fetch "$name"
          echo "TEXLIVE_IMAGE=$name" >> "$GITHUB_ENV"
      - name: Check the image as the server does
        run: IMAGES_DIR="$RUNNER_TEMP/images" bash deploy/iitmandi/texlive/texlive-images.sh check "$TEXLIVE_IMAGE"

      # Real compiles in Docker with the production seccomp profile: a stopped
      # or timed-out compile keeps a valid PDF of the pages already typeset,
      # and a paused compile's time does not count.
      - name: Stop and pause real compiles
        working-directory: services/clsi
        run: |
          mkdir -p compiles
          DOCKER_RUNNER=true \
          TEX_LIVE_DOCKER_IMAGE="$TEXLIVE_IMAGE" \
          TEXLIVE_IMAGE_USER="$(id -u):$(id -g)" \
          SANDBOXED_COMPILES_HOST_DIR_COMPILES="$PWD/compiles" \
          LOG_LEVEL=warn \
          yarn vitest run test/docker

  git-bridge:
    name: Git bridge
    needs: changes
    if: needs.changes.outputs.git_bridge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: services/git-bridge/pom.xml

      - name: Unit and integration tests
        run: mvn -B -f services/git-bridge/pom.xml verify

      - name: Build the image
        run: docker build -t iitmandi/latex-x-iit-mandi:ci services/git-bridge

      # Start it the way the Toolkit does: as root with /server-pro-start.sh,
      # with the web app's settings in the environment.
      - name: Start the image
        run: |
          docker run -d --name git-bridge --user root -p 127.0.0.1:8000:8000 \
            -e GIT_BRIDGE_API_BASE_URL=http://127.0.0.1/api/v0/ \
            -e GIT_BRIDGE_OAUTH2_SERVER=http://127.0.0.1 \
            -e GIT_BRIDGE_POSTBACK_BASE_URL=http://127.0.0.1:8000 \
            -e GIT_BRIDGE_ROOT_DIR=/data/git-bridge \
            -e "GIT_BRIDGE_SERVICE_NAME=Latex X IIT-Mandi" \
            -e OVERLEAF_SITE_URL=https://latex.iitmandi.ac.in/ \
            -e OVERLEAF_ADMIN_EMAIL=latex-admin@iitmandi.ac.in \
            iitmandi/latex-x-iit-mandi:ci /server-pro-start.sh
          for _ in $(seq 60); do
            if curl -sf http://127.0.0.1:8000/status | grep -q ok; then
              exit 0
            fi
            sleep 2
          done
          echo "git bridge did not answer on /status"
          exit 1

      - name: Check the running container
        run: |
          docker exec git-bridge cat /conf/runtime.json > runtime.json
          jq -e '.serviceName == "Latex X IIT-Mandi"
            and .siteUrl == "https://latex.iitmandi.ac.in"
            and .supportEmail == "latex-admin@iitmandi.ac.in"' runtime.json
          java_user=$(docker exec git-bridge ps -eo user=,comm= | awk '$2 == "java" {print $1}')
          echo "java runs as: $java_user"
          test "$java_user" = node
          data_owner=$(docker exec git-bridge stat -c %U /data/git-bridge)
          echo "/data/git-bridge is owned by: $data_owner"
          test "$data_owner" = node
          # A message git users see carries our name, not the upstream one
          curl -s -X POST http://127.0.0.1:8000/abc123.git/info/lfs/objects/batch | tee lfs.json
          jq -e '.message == "ERROR: Git LFS is not supported on Latex X IIT-Mandi"' lfs.json

      - name: Container logs
        if: failure()
        run: docker logs git-bridge || true

      - name: Remove the container
        if: always()
        run: docker rm -f git-bridge || true
