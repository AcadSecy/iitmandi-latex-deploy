name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branding:
    name: Branding and stylesheets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # dependencies are cached below; the automatic cache needs Corepack first
          package-manager-cache: false
      - name: Locale strings use __appName__
        run: node tools/branding/rebrand-locales.mjs --check
      - name: Help links stay on the platform
        run: node tools/branding/rewrite-help-links.mjs --check
      - name: Compile the main stylesheet
        run: |
          mkdir -p "$RUNNER_TEMP/sass"
          npm install --prefix "$RUNNER_TEMP/sass" --no-audit --no-fund sass@1 bootstrap@5.3.7
          "$RUNNER_TEMP/sass/node_modules/.bin/sass" --no-source-map --quiet \
            --load-path="$RUNNER_TEMP/sass/node_modules" \
            services/web/frontend/stylesheets/main-style.scss "$RUNNER_TEMP/main-style.css"

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the type check diffs against the base commit
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # dependencies are cached below; the automatic cache needs Corepack first
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-

      - name: Install dependencies
        run: yarn workspaces focus @overleaf/web

      # The LaTeX and BibTeX parsers are built from their grammars (not committed)
      - name: Generate editor parsers
        run: yarn workspace @overleaf/web run lezer-latex:generate

      # Upstream's public repository leaves out some private modules, and the
      # extended Community Edition (CEP) is not type-clean, so the full type
      # check always reports errors. Fail only on type errors in files that this
      # change touches, counting CEP's own files as upstream.
      - name: Type-check changed files
        working-directory: services/web
        env:
          # yu-i-i/overleaf-cep v6.3.0-ext-v5.1; update when merging a newer release
          CEP_BASE: 738bebb743e6ea8f579a1860e1de1fbfc292f505
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) base="HEAD~1" ;;
          esac
          if git merge-base --is-ancestor "$base" "$CEP_BASE" 2>/dev/null &&
            git merge-base --is-ancestor "$CEP_BASE" HEAD 2>/dev/null; then
            base="$CEP_BASE"
          fi
          yarn tsc --noEmit --pretty false > "$RUNNER_TEMP/tsc.log" || true
          echo "$(grep -c 'error TS' "$RUNNER_TEMP/tsc.log" || true) type errors in total"
          git diff --name-only "$base"...HEAD -- . | sed -e 's#^services/web/##' -e '/^$/d' > "$RUNNER_TEMP/changed.txt"
          grep 'error TS' "$RUNNER_TEMP/tsc.log" \
            | grep -vE "error TS2307: Cannot find module '([^']*/(modules|stories)/|@wf/|@modules/|[^']*webpack\.config\.dev')" \
            | grep -F -f "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/errors.txt" || true
          if [ -s "$RUNNER_TEMP/errors.txt" ]; then
            cat "$RUNNER_TEMP/errors.txt"
            exit 1
          fi
          echo "No type errors in changed files"

      # The upstream repository does not publish its ESLint, Stylelint or
      # Prettier configuration, so linting is not part of CI yet.

      - name: Unit tests (rebranded backend code and compile queue)
        working-directory: services/web
        run: >
          yarn vitest run --project=Parallel
          test/unit/src/Compile/CompileQueue.test.mjs
          test/unit/src/Compile/CompileManager.test.mjs
          test/unit/src/Email
          test/unit/src/Downloads/ProjectDownloadsController.test.mjs
          test/unit/src/User/UserDeleter.test.mjs
          test/unit/src/User/UserEmailsController.test.mjs

      # Only the handlers the compile queue changes. Six upstream tests for the
      # SyncTeX request validation (proxySyncCode/proxySyncPdf) fail in this
      # environment; they cover code this branch does not change.
      - name: Unit tests (compile controller)
        working-directory: services/web
        run: >
          yarn vitest run --project=Parallel
          test/unit/src/Compile/CompileController.test.mjs
          --testNamePattern '^CompileController (compile|stopCompile) '

      - name: Unit tests (editor waiting room against Redis, storage quota)
        working-directory: services/web
        env:
          TEST_REDIS_HOST: localhost
        run: >
          yarn vitest run --project=Parallel
          modules/editor-waiting-room
          modules/storage-quota

      - name: Frontend tests (project list, welcome message, Ask AI)
        working-directory: services/web
        env:
          NODE_ENV: test
          TZ: GMT
        run: >
          yarn mocha --timeout 5000 --exit
          --extension js,jsx,mjs,ts,tsx
          --require test/frontend/bootstrap.js
          test/frontend/features/project-list/components/project-list-root.test.tsx
          test/frontend/features/project-list/components/welcome-message.test.tsx
          modules/ask-ai/test/frontend/open-assistant.test.ts

  git-bridge:
    name: Git bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: services/git-bridge/pom.xml

      - name: Unit and integration tests
        run: mvn -B -f services/git-bridge/pom.xml verify

      - name: Build the image
        run: docker build -t iitmandi/latex-x-iit-mandi:ci services/git-bridge

      # Start it the way the Toolkit does: as root with /server-pro-start.sh,
      # with the web app's settings in the environment.
      - name: Start the image
        run: |
          docker run -d --name git-bridge --user root -p 127.0.0.1:8000:8000 \
            -e GIT_BRIDGE_API_BASE_URL=http://127.0.0.1/api/v0/ \
            -e GIT_BRIDGE_OAUTH2_SERVER=http://127.0.0.1 \
            -e GIT_BRIDGE_POSTBACK_BASE_URL=http://127.0.0.1:8000 \
            -e GIT_BRIDGE_ROOT_DIR=/data/git-bridge \
            -e "GIT_BRIDGE_SERVICE_NAME=Latex X IIT-Mandi" \
            -e OVERLEAF_SITE_URL=https://latex.iitmandi.ac.in/ \
            -e OVERLEAF_ADMIN_EMAIL=latex-admin@iitmandi.ac.in \
            iitmandi/latex-x-iit-mandi:ci /server-pro-start.sh
          for _ in $(seq 60); do
            if curl -sf http://127.0.0.1:8000/status | grep -q ok; then
              exit 0
            fi
            sleep 2
          done
          echo "git bridge did not answer on /status"
          exit 1

      - name: Check the running container
        run: |
          docker exec git-bridge cat /conf/runtime.json > runtime.json
          jq -e '.serviceName == "Latex X IIT-Mandi"
            and .siteUrl == "https://latex.iitmandi.ac.in"
            and .supportEmail == "latex-admin@iitmandi.ac.in"' runtime.json
          java_user=$(docker exec git-bridge ps -eo user=,comm= | awk '$2 == "java" {print $1}')
          echo "java runs as: $java_user"
          test "$java_user" = node
          data_owner=$(docker exec git-bridge stat -c %U /data/git-bridge)
          echo "/data/git-bridge is owned by: $data_owner"
          test "$data_owner" = node
          # A message git users see carries our name, not the upstream one
          curl -s -X POST http://127.0.0.1:8000/abc123.git/info/lfs/objects/batch | tee lfs.json
          jq -e '.message == "ERROR: Git LFS is not supported on Latex X IIT-Mandi"' lfs.json

      - name: Container logs
        if: failure()
        run: docker logs git-bridge || true

      - name: Remove the container
        if: always()
        run: docker rm -f git-bridge || true
