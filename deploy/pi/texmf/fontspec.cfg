% IIT Mandi LaTeX: fontspec's settings, and free fonts for Microsoft's font
% names (see Dockerfile-texlive).
%
% fontspec reads the first fontspec.cfg it finds, and this one is found before
% TeX Live's own, so it starts with that file's settings: TeX ligatures (-- for
% an en dash, ``quotes'') for the main and sans fonts, and fixed spaces for the
% mono font.
\defaultfontfeatures
 [\rmfamily,\sffamily]
 {Ligatures=TeX}
\defaultfontfeatures
 [\ttfamily]
 {WordSpace={1,0,0},
  HyphenChar=None,
  PunctuationSpace=WordSpace}

% Documents that come from Word ask for Calibri, Cambria, Times New Roman,
% Arial or Courier New. Those are Microsoft's fonts, which no TeX distribution
% may include. The fonts below are free and were made with the same metrics,
% so lines and pages break as they would with the originals. fontspec reads
% this file when it loads, so \setmainfont{Calibri} gets Carlito. It reads it
% with expl3 syntax, where spaces are left out, hence ~ for the spaces in names.
\defaultfontfeatures[Calibri]{
  UprightFont = Carlito, BoldFont = Carlito~Bold,
  ItalicFont = Carlito~Italic, BoldItalicFont = Carlito~Bold~Italic}
\defaultfontfeatures[Cambria]{
  UprightFont = Caladea, BoldFont = Caladea~Bold,
  ItalicFont = Caladea~Italic, BoldItalicFont = Caladea~Bold~Italic}
\defaultfontfeatures[Times~New~Roman]{
  UprightFont = Liberation~Serif, BoldFont = Liberation~Serif~Bold,
  ItalicFont = Liberation~Serif~Italic, BoldItalicFont = Liberation~Serif~Bold~Italic}
\defaultfontfeatures[Arial]{
  UprightFont = Liberation~Sans, BoldFont = Liberation~Sans~Bold,
  ItalicFont = Liberation~Sans~Italic, BoldItalicFont = Liberation~Sans~Bold~Italic}
\defaultfontfeatures[Courier~New]{
  UprightFont = Liberation~Mono, BoldFont = Liberation~Mono~Bold,
  ItalicFont = Liberation~Mono~Italic, BoldItalicFont = Liberation~Mono~Bold~Italic}

% The same metrics too: Helvetica, Times and Courier (Arial, Times New Roman
% and Courier New were made to match them), and Georgia (Gelasio).
\defaultfontfeatures[Helvetica]{
  UprightFont = Liberation~Sans, BoldFont = Liberation~Sans~Bold,
  ItalicFont = Liberation~Sans~Italic, BoldItalicFont = Liberation~Sans~Bold~Italic}
\defaultfontfeatures[Times]{
  UprightFont = Liberation~Serif, BoldFont = Liberation~Serif~Bold,
  ItalicFont = Liberation~Serif~Italic, BoldItalicFont = Liberation~Serif~Bold~Italic}
\defaultfontfeatures[Courier]{
  UprightFont = Liberation~Mono, BoldFont = Liberation~Mono~Bold,
  ItalicFont = Liberation~Mono~Italic, BoldItalicFont = Liberation~Mono~Bold~Italic}
\defaultfontfeatures[Georgia]{
  UprightFont = Gelasio-Regular.otf, BoldFont = Gelasio-Bold.otf,
  ItalicFont = Gelasio-Italic.otf, BoldItalicFont = Gelasio-BoldItalic.otf}

% No free font has the metrics of these, so lines may break a little
% differently: the closest free design, from TeX Live. Fonts from TeX Live
% (Gelasio above too) are given by file name, which XeLaTeX and LuaLaTeX both
% find through TeX's own file search: by name, XeLaTeX did not find
% "TeX Gyre Pagella Bold".
\defaultfontfeatures[Palatino~Linotype]{
  UprightFont = texgyrepagella-regular.otf, BoldFont = texgyrepagella-bold.otf,
  ItalicFont = texgyrepagella-italic.otf, BoldItalicFont = texgyrepagella-bolditalic.otf}
\defaultfontfeatures[Book~Antiqua]{
  UprightFont = texgyrepagella-regular.otf, BoldFont = texgyrepagella-bold.otf,
  ItalicFont = texgyrepagella-italic.otf, BoldItalicFont = texgyrepagella-bolditalic.otf}
\defaultfontfeatures[Century~Schoolbook]{
  UprightFont = texgyreschola-regular.otf, BoldFont = texgyreschola-bold.otf,
  ItalicFont = texgyreschola-italic.otf, BoldItalicFont = texgyreschola-bolditalic.otf}
\defaultfontfeatures[Bookman~Old~Style]{
  UprightFont = texgyrebonum-regular.otf, BoldFont = texgyrebonum-bold.otf,
  ItalicFont = texgyrebonum-italic.otf, BoldItalicFont = texgyrebonum-bolditalic.otf}
\defaultfontfeatures[Century~Gothic]{
  UprightFont = texgyreadventor-regular.otf, BoldFont = texgyreadventor-bold.otf,
  ItalicFont = texgyreadventor-italic.otf, BoldItalicFont = texgyreadventor-bolditalic.otf}
\defaultfontfeatures[Garamond]{
  UprightFont = EBGaramond-Regular.otf, BoldFont = EBGaramond-Bold.otf,
  ItalicFont = EBGaramond-Italic.otf, BoldItalicFont = EBGaramond-BoldItalic.otf}

% Hindi from Word: Mangal and Nirmala UI (sans), Kokila (serif). Devanagari
% has no italic, so only bold is given.
\defaultfontfeatures[Mangal]{
  UprightFont = Noto~Sans~Devanagari, BoldFont = Noto~Sans~Devanagari~Bold}
\defaultfontfeatures[Nirmala~UI]{
  UprightFont = Noto~Sans~Devanagari, BoldFont = Noto~Sans~Devanagari~Bold}
\defaultfontfeatures[Kokila]{
  UprightFont = Noto~Serif~Devanagari, BoldFont = Noto~Serif~Devanagari~Bold}
