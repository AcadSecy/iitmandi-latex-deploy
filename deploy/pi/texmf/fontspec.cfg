% IIT Mandi LaTeX: free fonts for Microsoft's font names (see Dockerfile-texlive).
%
% Documents that come from Word ask for Calibri, Cambria, Times New Roman,
% Arial or Courier New. Those are Microsoft's fonts, which no TeX distribution
% may include. The fonts below are free and were made with the same metrics,
% so lines and pages break as they would with the originals. fontspec reads
% this file when it loads, so \setmainfont{Calibri} gets Carlito.
\defaultfontfeatures[Calibri]{
  UprightFont = Carlito, BoldFont = Carlito Bold,
  ItalicFont = Carlito Italic, BoldItalicFont = Carlito Bold Italic}
\defaultfontfeatures[Cambria]{
  UprightFont = Caladea, BoldFont = Caladea Bold,
  ItalicFont = Caladea Italic, BoldItalicFont = Caladea Bold Italic}
\defaultfontfeatures[Times New Roman]{
  UprightFont = Liberation Serif, BoldFont = Liberation Serif Bold,
  ItalicFont = Liberation Serif Italic, BoldItalicFont = Liberation Serif Bold Italic}
\defaultfontfeatures[Arial]{
  UprightFont = Liberation Sans, BoldFont = Liberation Sans Bold,
  ItalicFont = Liberation Sans Italic, BoldItalicFont = Liberation Sans Bold Italic}
\defaultfontfeatures[Courier New]{
  UprightFont = Liberation Mono, BoldFont = Liberation Mono Bold,
  ItalicFont = Liberation Mono Italic, BoldItalicFont = Liberation Mono Bold Italic}
